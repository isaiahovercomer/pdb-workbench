<div id="songbookDesk">
<style>
#songbookDesk .bookLayout{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,2fr);gap:1rem}
#songbookDesk .bookLayout>*{min-width:0}
#songbookDesk .bookActions{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
#songbookDesk .bookActions>*{margin:0}
#songbookDesk .bookIndex{width:100%;min-height:9rem}
#songbookDesk .bookPreview{padding:1rem;border-left:3px solid #be9e5a;background:#f7f7f0;overflow-wrap:anywhere}
#songbookDesk .bookVerse{white-space:pre-wrap}
#songbookDesk .bookPair{display:inline-flex;flex-direction:column;vertical-align:bottom}
#songbookDesk .bookChord{font:bold .8em/1.2 monospace;color:#946627}
#songbookDesk .bookFoot{white-space:pre-wrap;color:#496258}
#songbookDesk .bookLyrics{min-height:13rem}
@media(max-width:720px){#songbookDesk .bookLayout{grid-template-columns:1fr}#songbookDesk .bookIndex{min-height:5rem}}
</style>
<div class="bookLayout">
<div class="card"><h2>書籍與章節</h2>
<label>書名<input data-bk="title" maxlength="240" placeholder="例如：詩歌選集"></label>
<label>編者<input data-bk="author" maxlength="240" placeholder="選填"></label>
<label>章節目錄<select data-bk="list" class="bookIndex" size="7"></select></label>
<div class="bookActions"><button type="button" data-bk="add">新增章節</button><button type="button" data-bk="up">上移</button><button type="button" data-bk="down">下移</button><button type="button" data-bk="remove">移除</button></div>
<label>匯入 ChordPro（加入章節）<input type="file" data-bk="import" multiple accept=".cho,.chopro,.chordpro,.pro,.txt"></label>
<label>還原編輯檔<input type="file" data-bk="restore" accept=".json"></label>
</div>
<div class="card"><h2>編輯章節</h2>
<label>篇名或歌名<input data-bk="name" maxlength="300"></label>
<label>正文或歌詞<textarea data-bk="body" class="bookLyrics" placeholder="可直接輸入文章，或把和弦寫在對應的歌詞前，如 [G]晨光照耀。"></textarea></label>
<div class="bookActions"><button type="button" data-bk="lower">本章和弦降半音</button><button type="button" data-bk="raise">本章和弦升半音</button></div>
<label>經文出處與附註<textarea data-bk="note" rows="3" placeholder="選填，每行一筆"></textarea></label>
<details><summary>本章排版預覽</summary><div class="bookPreview" data-bk="preview"></div></details>
<div class="bookActions"><button type="button" class="primary" data-bk="epub">下載 EPUB</button><button type="button" data-bk="html">下載單頁 HTML</button><button type="button" data-bk="excel">下載 Excel</button><button type="button" data-bk="cho">下載 ChordPro</button><button type="button" data-bk="palm">送至 PalmDOC 製作區</button><button type="button" data-bk="backup">儲存編輯檔</button></div>
<small data-bk="status" role="status"></small></div>
</div></div>
<script>
(()=>{
const root=document.getElementById('songbookDesk'), ui=Object.fromEntries(Array.from(root.querySelectorAll('[data-bk]'),e=>[e.dataset.bk,e]));
const blank=()=>({name:'',body:'',note:''}), key='pdb-songbook-draft-v1', enc=new TextEncoder();
let book={title:'',author:'',chapters:[blank()]}, active=0;
const heading=(c,i)=>c.name.trim()||'第 '+(i+1)+' 章';
function safeXml(s){return Array.from(String(s),c=>{const n=c.codePointAt(0);return n===9||n===10||n===13||(n>=32&&n<=0xd7ff)||(n>=0xe000&&n<=0xfffd)||n>=0x10000?c:'�'}).join('').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function valid(b){return b&&typeof b.title==='string'&&typeof b.author==='string'&&Array.isArray(b.chapters)&&b.chapters.length>0&&b.chapters.length<=2000&&b.chapters.every(c=>c&&['name','body','note'].every(k=>typeof c[k]==='string'))}
function message(t){ui.status.textContent=t}
function store(){try{localStorage.setItem(key,JSON.stringify(book))}catch{message('瀏覽器未能保存草稿，請下載編輯檔備份。')}}
function marked(line){
 const matches=[...line.matchAll(/\[([^\]\r\n]{1,32})\]/g)];if(!matches.length)return safeXml(line);
 const pieces=[safeXml(line.slice(0,matches[0].index))];matches.forEach((m,i)=>{const text=line.slice(m.index+m[0].length,matches[i+1]?.index??line.length);pieces.push('<span class="bookPair"><strong class="bookChord">'+safeXml(m[1])+'</strong><span>'+safeXml(text||'\u00a0')+'</span></span>')});return pieces.join('');
}
function chapter(c,i){return '<h2>'+safeXml(heading(c,i))+'</h2><div class="bookVerse">'+c.body.replace(/\r\n?/g,'\n').split('\n').map(marked).join('<br/>')+'</div>'+(c.note.trim()?'<p class="bookFoot">'+safeXml(c.note)+'</p>':'')}
function updateIndex(){ui.list.replaceChildren(...book.chapters.map((c,i)=>new Option((i+1)+'. '+heading(c,i),String(i))));ui.list.selectedIndex=active;ui.up.disabled=active===0;ui.down.disabled=active===book.chapters.length-1;}
function render(){ui.title.value=book.title;ui.author.value=book.author;const c=book.chapters[active];ui.name.value=c.name;ui.body.value=c.body;ui.note.value=c.note;updateIndex();ui.preview.innerHTML=chapter(c,active)}
try{const draft=JSON.parse(localStorage.getItem(key));if(valid(draft))book=draft}catch{}
for(const k of ['title','author','name','body','note'])ui[k].oninput=()=>{if(k==='title'||k==='author')book[k]=ui[k].value;else book.chapters[active][k]=ui[k].value;if(k==='name')updateIndex();ui.preview.innerHTML=chapter(book.chapters[active],active);message('');store()};
ui.list.onchange=()=>{active=ui.list.selectedIndex;render()};
ui.add.onclick=()=>{if(book.chapters.length>=2000)return message('每本最多 2,000 章。');book.chapters.splice(++active,0,blank());render();store();ui.name.focus()};
for(const [k,d] of [['up',-1],['down',1]])ui[k].onclick=()=>{const next=active+d;if(next<0||next>=book.chapters.length)return;[book.chapters[active],book.chapters[next]]=[book.chapters[next],book.chapters[active]];active=next;render();store()};
ui.remove.onclick=()=>{if(!confirm('移除「'+heading(book.chapters[active],active)+'」？'))return;book.chapters.splice(active,1);if(!book.chapters.length)book.chapters.push(blank());active=Math.min(active,book.chapters.length-1);render();store()};
const bookCss='body{max-width:48em;margin:1em auto;padding:1em;font-family:serif;line-height:1.75;color:#213f38}h1,h2{line-height:1.4}.bookVerse,.bookFoot{white-space:pre-wrap;overflow-wrap:anywhere}.bookPair{display:inline-flex;flex-direction:column;vertical-align:bottom}.bookChord{font:bold .8em/1.25 monospace;color:#775020}.bookFoot{border-top:1px solid #ccc;padding-top:.7em}section{margin:2em 0;break-before:page}a{color:#17584c}';
function htmlBook(b){return '<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+safeXml(b.title)+'</title><style>'+bookCss+'</style><main><h1>'+safeXml(b.title)+'</h1><p>'+safeXml(b.author)+'</p><nav id="toc"><h2>目錄</h2><ol>'+b.chapters.map((c,i)=>'<li><a href="#c'+i+'">'+safeXml(heading(c,i))+'</a></li>').join('')+'</ol></nav>'+b.chapters.map((c,i)=>'<section id="c'+i+'">'+chapter(c,i)+'<p><a href="#toc">回目錄</a></p></section>').join('')+'</main></html>'}
/* SHARED_ZIP */
function epubBook(b){
 const xml='<?xml version="1.0" encoding="UTF-8"?>',uuid='urn:uuid:'+crypto.randomUUID(),title=safeXml(b.title);
 const page=(t,body)=>xml+'<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="zh-Hant" lang="zh-Hant"><head><title>'+t+'</title><link href="book.css" rel="stylesheet" type="text/css"/></head><body>'+body+'</body></html>';
 const names=b.chapters.map((c,i)=>safeXml(heading(c,i))), links=names.map((n,i)=>'<li><a href="c'+i+'.xhtml">'+n+'</a></li>').join('');
 const opf=xml+'<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="id"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="id">'+uuid+'</dc:identifier><dc:title>'+title+'</dc:title><dc:language>zh-Hant</dc:language>'+(b.author?'<dc:creator>'+safeXml(b.author)+'</dc:creator>':'')+'<meta property="dcterms:modified">'+new Date().toISOString().split('.')[0]+'Z</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="css" href="book.css" media-type="text/css"/><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>'+names.map((_,i)=>'<item id="c'+i+'" href="c'+i+'.xhtml" media-type="application/xhtml+xml"/>').join('')+'</manifest><spine toc="ncx"><itemref idref="nav"/>'+names.map((_,i)=>'<itemref idref="c'+i+'"/>').join('')+'</spine></package>';
 const ncx=xml+'<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="'+uuid+'"/></head><docTitle><text>'+title+'</text></docTitle><navMap>'+names.map((n,i)=>'<navPoint id="p'+i+'" playOrder="'+(i+1)+'"><navLabel><text>'+n+'</text></navLabel><content src="c'+i+'.xhtml"/></navPoint>').join('')+'</navMap></ncx>';
 return zip([['mimetype','application/epub+zip'],['META-INF/container.xml',xml+'<container xmlns="urn:oasis:names:tc:opendocument:xmlns:container" version="1.0"><rootfiles><rootfile full-path="EPUB/book.opf" media-type="application/oebps-package+xml"/></rootfiles></container>'],['EPUB/book.opf',opf],['EPUB/book.css',bookCss],['EPUB/toc.ncx',ncx],['EPUB/nav.xhtml',page(title,'<h1>'+title+'</h1><nav epub:type="toc"><h2>目錄</h2><ol>'+links+'</ol></nav>')],...names.map((n,i)=>['EPUB/c'+i+'.xhtml',page(n,chapter(b.chapters[i],i))])]);
}

const chordPattern=/^([A-G])([#b♯♭]?)(?:(m(?:aj|in)?|M|maj|min|dim|aug|sus|add|no|omit|alt|dom|Δ|ø|°|\+|-|[#b♯♭]|[0-9]|[(),])*)(?:\/([A-G])([#b♯♭]?))?$/;
function shifted(name,step){
 const m=chordPattern.exec(name);
 if(!m)return name;
 const sharp=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],flat=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
 const pitches={C:0,D:2,E:4,F:5,G:7,A:9,B:11};const spell=step>0?sharp:flat;
 function note(letter,sign){const diff=sign==='b'||sign==='♭'?-1:sign==='#'||sign==='♯'?1:0;return spell[(pitches[letter]+diff+step+12)%12]}
 const rootLength=m[1].length+m[2].length,slash=name.lastIndexOf('/');
 const suffix=name.slice(rootLength,slash===-1?undefined:slash);
 return note(m[1],m[2])+suffix+(m[4]?'/'+note(m[4],m[5]):'');
}
for(const [id,step] of [['lower',-1],['raise',1]])ui[id].onclick=()=>{
 const c=book.chapters[active];let count=0;
 const next=c.body.replace(/\[([^\]\r\n]{1,32})\]/g,(token,name)=>{const chord=shifted(name,step);if(chord===name)return token;count++;return '['+chord+']'});
 if(!count)return message('本章沒有可移調的方括號和弦。');
 c.body=next;render();store();message('已將本章 '+count+' 個和弦'+(step>0?'升':'降')+'半音。');
};
function excelBook(b){
 const xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 const main='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
 const rel='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
 const pkg='http://schemas.openxmlformats.org/package/2006/relationships';
 const rows=[];let seq=0;
 function row(values){
   if(seq>=1048576)throw Error('行數超過 Excel 工作表上限。');
   seq++;const cells=values.map((v,i)=>{const addr=String.fromCharCode(65+i)+seq;
    if(typeof v==='number')return '<c r="'+addr+'"><v>'+v+'</v></c>';
    if(v.length>32767)throw Error('第 '+seq+' 列有欄位超過 Excel 的字數上限，請先拆分長段落。');
    const value=safeXml(v.replace(/_x([0-9a-fA-F]{4})_/g,'_x005F_x$1_'));
    return '<c r="'+addr+'" t="inlineStr"><is><t xml:space="preserve">'+value+'</t></is></c>';
   }).join('');rows.push('<row r="'+seq+'">'+cells+'</row>');
 }
 row(['書名','編者','章序','篇名或歌名','行序','內文或歌詞','和弦','含和弦原文','經文出處與附註']);
 b.chapters.forEach((c,i)=>c.body.split(/\r\n?|\n/).forEach((line,j)=>{
   const chords=[];const lyrics=line.replace(/\[([^\]\r\n]{1,32})\]/g,(token,name)=>{if(!chordPattern.test(name))return token;chords.push(name);return ''});
   row([b.title,b.author,i+1,heading(c,i),j+1,lyrics,chords.join(' '),line,j===0?c.note:'']);
 }));
 const sheet=xml+'<worksheet xmlns="'+main+'"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/><cols>'+[22,15,8,24,8,48,18,54,38].map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols><sheetData>'+rows.join('')+'</sheetData><autoFilter ref="A1:I'+seq+'"/></worksheet>';
 const relationship=(type,target)=>xml+'<Relationships xmlns="'+pkg+'"><Relationship Id="rId1" Type="'+rel+'/'+type+'" Target="'+target+'"/></Relationships>';
 return zip([
 ['[Content_Types].xml',xml+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
 ['_rels/.rels',relationship('officeDocument','xl/workbook.xml')],
 ['xl/workbook.xml',xml+'<workbook xmlns="'+main+'" xmlns:r="'+rel+'"><sheets><sheet name="篇章與歌詞" sheetId="1" r:id="rId1"/></sheets></workbook>'],
 ['xl/_rels/workbook.xml.rels',relationship('worksheet','worksheets/sheet1.xml')],
 ['xl/worksheets/sheet1.xml',sheet]],'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function readCho(raw,fallback){
 const songs=[];let c=blank(),hasTitle=false;
 function push(){c.body=c.body.replace(/\n$/,'');if(c.body.trim()||hasTitle||c.note.trim()){if(!c.name)c.name=fallback;songs.push(c)}c=blank();hasTitle=false}
 for(const line of raw.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n')){
  const t=line.match(/^\s*\{(?:title|t)\s*:\s*(.*?)\}\s*$/i);
  if(t){if(hasTitle||c.body.trim())push();c.name=t[1];hasTitle=true;continue}
  if(/^\s*\{new_song\}\s*$/i.test(line)){push();continue}
  const note=line.match(/^\s*\{comment:\s*經文附註：(.*)\}\s*$/);if(note){c.note+=(c.note?'\n':'')+note[1];continue}
  c.body+=line+'\n';
 }
 push();return songs;
}
function writeCho(b){return b.chapters.map((c,i)=>'{title: '+heading(c,i).replace(/[\r\n]/g,' ')+'}\n'+(c.note?c.note.split(/\r?\n/).map(n=>'{comment: 經文附註：'+n+'}').join('\n')+'\n':'')+c.body).join('\n{new_song}\n')}
ui.import.onchange=async()=>{try{const added=[];for(const f of ui.import.files){if(f.size>10*1024*1024)throw Error('單檔上限為 10 MB。');added.push(...readCho(new TextDecoder('utf-8',{fatal:true}).decode(await f.arrayBuffer()),f.name.replace(/\.[^.]+$/,'')))}if(!added.length)throw Error('未讀到歌詞。');const pristine=book.chapters.length===1&&Object.values(book.chapters[0]).every(s=>!s);if(added.length+(pristine?0:book.chapters.length)>2000)throw Error('每本最多 2,000 章。');if(pristine)book.chapters=[];active=book.chapters.length;book.chapters.push(...added);render();message('已加入 '+added.length+' 章。');store()}catch(e){message('匯入失敗。'+e.message)}finally{ui.import.value=''}};
ui.restore.onchange=async()=>{try{const f=ui.restore.files[0];if(!f)return;if(f.size>40*1024*1024)throw Error('編輯檔上限為 40 MB。');const b=JSON.parse(await f.text());if(!valid(b))throw Error('編輯檔格式不符。');if(!confirm('以選取的編輯檔取代目前整本草稿？'))return;book=b;active=0;render();message('已還原編輯檔。');store()}catch(e){message('還原失敗。'+e.message)}finally{ui.restore.value=''}};
for(const [id,ext,type,make] of [['excel','xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',excelBook],['html','html','text/html',htmlBook],['epub','epub','application/epub+zip',epubBook],['cho','cho','text/plain',writeCho],['backup','json','application/json',b=>JSON.stringify(b,null,2)]]){
 ui[id].onclick=()=>{try{if(id!=='backup'&&!book.title.trim()){ui.title.focus();return message('請先填寫書名。')}const output=make(book),blob=output instanceof Blob?output:new Blob([output],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(book.title.trim()||'書籍草稿').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);message('已產生 '+ext.toUpperCase()+' 檔。')}catch(e){message('匯出失敗。'+e.message)}};
}
ui.palm.onclick=()=>openPalmDraft(book.title,book.chapters.map((c,i)=>[heading(c,i),c.body,c.note].filter(Boolean).join('\n')).join('\n\n'));
render();
})();
</script>
